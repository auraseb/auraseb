name: ticker
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ticker.yml"]
permissions:
  contents: write
jobs:
  ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: auraseb/brand-ticker@v1
        with:
          layout: strip
          max_logos: 40
          exclude_orgs: open-meteo,Boavizta,Green-Software-Foundation,electricitymaps,handlewithcarecollective,planetlabs
